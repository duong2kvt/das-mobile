name: Test and deploy D.A.S
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve locked dependencies on cloud
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only; fi
          npm ci
      - name: Inspect original reward media
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          mkdir -p public/qa
          for name in reward reward-ticket; do
            ffprobe -v error -show_entries stream=width,height,duration -of json public/assets/$name.mp4 > public/qa/$name.json
            ffmpeg -y -ss 2 -i public/assets/$name.mp4 -frames:v 1 public/qa/$name-before.jpg
            ffmpeg -y -i public/assets/$name.mp4 -vf 'drawbox=x=398:y=1444:w=286:h=86:color=0x29251f:t=fill' -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -movflags +faststart -an public/assets/$name-clean.mp4
            ffmpeg -y -ss 2 -i public/assets/$name-clean.mp4 -frames:v 1 public/qa/$name-after.jpg
          done
      - name: Prepare source assets
        run: |
          npm run prepare:design
          node scripts/references.mjs
      - name: Save durable assets and lockfile to repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package-lock.json design-source src public/assets public/qa
          git diff --cached --quiet || git commit -m 'Save locked build, generated source and durable Figma assets'
          git push
      - name: Verify and build
        run: |
          ffmpeg -y -i public/assets/app-icon.png -vf scale=192:192 public/assets/app-icon-192.png
          ffmpeg -y -i public/assets/app-icon.png -vf scale=512:512 public/assets/app-icon-512.png
          npm test
          npm run build
      - name: Install browser for cloud QA
        run: npx playwright install --with-deps chromium
      - name: Check mobile flows and offline app
        run: npm run test:browser
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: das-mobile-qa
          path: |
            test-results
            playwright-report
            public/qa
      - name: Include screenshots with preview
        run: cp test-results/*.png dist/qa/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

